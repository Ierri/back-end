name: Deploy

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: GHCR e Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target_environment }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Definir nome da imagem
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.target_environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target_environment }}

      - name: Verificar a API com MongoDB antes de publicar
        run: |
          cleanup() {
            docker rm --force ierri-api-smoke ierri-mongo-smoke >/dev/null 2>&1 || true
            docker network rm ierri-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create ierri-smoke
          docker run --detach --rm --name ierri-mongo-smoke --network ierri-smoke mongo:7
          SMOKE_JWT_SECRET=$(openssl rand -hex 32)
          docker run --detach --rm --name ierri-api-smoke --network ierri-smoke \
            --publish 127.0.0.1:3100:3000 \
            --env MONGODB_URI=mongodb://ierri-mongo-smoke:27017/ierri_smoke \
            --env JWT_SECRET="$SMOKE_JWT_SECRET" "$IMAGE_NAME:$IMAGE_TAG"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            --max-time 5 http://127.0.0.1:3100/ | jq --exit-status '.success == true'
          STATUS=$(curl --silent --show-error --max-time 5 --output "$RUNNER_TEMP/auth.json" \
            --write-out '%{http_code}' http://127.0.0.1:3100/auth/me)
          test "$STATUS" = 401
          jq --exit-status '.success == false and .error.code == "TOKEN_REQUIRED"' "$RUNNER_TEMP/auth.json"

      - name: Entrar no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem validada
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG-$GITHUB_SHA"

      - name: Solicitar deploy ao Coolify
        if: vars.COOLIFY_DEPLOY_ENABLED == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ vars.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "::error::Configure COOLIFY_TOKEN e COOLIFY_DEPLOY_WEBHOOK antes de ativar o deploy."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST "$COOLIFY_DEPLOY_WEBHOOK" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --output "$RUNNER_TEMP/coolify-deploy.json"
          echo "Deploy solicitado ao Coolify. Confirme a conclusão no painel da aplicação."

      - name: Resumo
        env:
          DEPLOY_ENABLED: ${{ vars.COOLIFY_DEPLOY_ENABLED }}
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: \`$IMAGE_NAME:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: \`$IMAGE_NAME:$IMAGE_TAG-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "- Coolify desativado: configure o ambiente e habilite COOLIFY_DEPLOY_ENABLED." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Deploy solicitado. A aceitação do webhook não confirma que a aplicação já está saudável." >> "$GITHUB_STEP_SUMMARY"
          fi
