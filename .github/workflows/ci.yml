name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - staging
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, TypeScript, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/ierri_ci
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_SESSION_PREFIX: "ierri:ci:session:"
      JWT_SECRET: ci-only-test-key-not-for-deployment-32-bytes
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ierri-ci-local
      S3_BUCKET: ierri-ci-${{ github.run_id }}-${{ github.run_attempt }}
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Configurar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Instalar dependências sem alterar o lockfile
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Testes
        run: bun run test

      - name: Iniciar MinIO local e criar bucket de teste
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/ierri-minio" \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          printf '%s  %s\n' \
            7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f \
            "$RUNNER_TEMP/ierri-minio" | sha256sum --check --
          chmod +x "$RUNNER_TEMP/ierri-minio"
          export S3_SECRET_ACCESS_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$S3_SECRET_ACCESS_KEY"
          echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            nohup "$RUNNER_TEMP/ierri-minio" server "$RUNNER_TEMP/ierri-minio-data" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/ierri-minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ierri-minio.pid"
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9000/minio/health/ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/ierri-minio.log"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { S3Client, CreateBucketCommand, HeadBucketCommand } from '@aws-sdk/client-s3';
          const client = new S3Client({
            endpoint: process.env.S3_ENDPOINT,
            region: process.env.S3_REGION,
            credentials: {
              accessKeyId: process.env.S3_ACCESS_KEY_ID,
              secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
            },
            forcePathStyle: true,
            maxAttempts: 2,
          });
          try {
            await client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET }));
            await client.send(new HeadBucketCommand({ Bucket: process.env.S3_BUCKET }));
          } finally {
            client.destroy();
          }
          NODE

      - name: Testes E2E com MongoDB, Redis e MinIO
        run: bun run test:e2e --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/ierri-e2e.json"

      - name: Confirmar execução dos testes E2E obrigatórios
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/ierri-e2e.json`, 'utf8'));
          for (const { file, label, minimum } of [
            { file: 'comentarios.e2e-spec.ts', label: 'Comentários', minimum: 12 },
            { file: 'modelagem.e2e-spec.ts', label: 'Modelagem', minimum: 5 },
            { file: 'perfis.e2e-spec.ts', label: 'Perfis e stacks', minimum: 12 },
            { file: 'votos.e2e-spec.ts', label: 'Votos', minimum: 27 },
            { file: 'seguidores.e2e-spec.ts', label: 'Seguidores', minimum: 19 },
            { file: 'publicacoes-privacidade.e2e-spec.ts', label: 'Privacidade de publicações', minimum: 8 },
            { file: 'feed-seguindo.e2e-spec.ts', label: 'Feed de Seguindo e ranking', minimum: 16 },
          ]) {
            const suite = report.testResults.find(({ name }) => {
              const path = name.replaceAll('\\', '/');
              return path === `test/${file}` || path.endsWith(`/test/${file}`);
            });
            const tests = suite?.assertionResults ?? [];
            const passed = tests.filter(({ status }) => status === 'passed').length;
            if (tests.length < minimum || passed !== tests.length) {
              console.error(`${label} E2E: ${passed}/${tests.length} testes aprovados; a suíte foi ignorada ou está incompleta.`);
              process.exit(1);
            }
            console.log(`${label} E2E: ${passed} testes executados e aprovados.`);
          }
          NODE

      - name: Build de produção
        run: bun run build

      - name: Encerrar MinIO de teste
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/ierri-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ierri-minio.pid")" || true
          fi
